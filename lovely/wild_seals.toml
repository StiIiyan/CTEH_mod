'''
position = 'at'
payload = '''
if self.seal == 'Red' or behaveLikeSeal(self,'Red') then
'''
match_indent = true


## Purple
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
if self.seal == 'Purple' and #G.consumeables.cards + G.GAME.consumeable_buffer < G.consumeables.config.card_limit then
'''
position = 'at'
payload = '''
if (self.seal == 'Purple' or behaveLikeSeal(self,'Purple')) and #G.consumeables.cards + G.GAME.consumeable_buffer < G.consumeables.config.card_limit then
'''
