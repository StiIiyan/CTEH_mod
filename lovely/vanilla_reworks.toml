[manifest]
version = "1.0.0"
dump_lua = true
priority = 0



# Reworks to game elements:

####################################################################################
# Planet Tycoon

# Make Planet Tycoon give double planet levels
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''
amount = amount or 1
'''
position = 'at'
payload = '''
if G.GAME.used_vouchers["v_planet_tycoon"] then
        amount = 2 * amount or 2
else 
        amount = amount or 1
end
'''
match_indent = true



# Make Planet Tycoon weights be as heavy as Planet Merchant
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''
        v_planet_tycoon=    {order = 20,     discovered = false, unlocked = false, available = true,cost = 10, name = "Planet Tycoon", pos = {x=2,y=1}, set = "Voucher", config = {extra = 32/4, extra_disp = 4}, requires = {'v_planet_merchant'},unlock_condition = {type = 'c_planets_bought', extra = 50}},
'''
position = 'at'
payload = '''
        v_planet_tycoon=    {order = 20,     discovered = false, unlocked = false, available = true,cost = 10, name = "Planet Tycoon", pos = {x=2,y=1}, set = "Voucher", config = {extra = 9.6/4, extra_disp = 2}, requires = {'v_planet_merchant'},unlock_condition = {type = 'c_planets_bought', extra = 50}},
'''
match_indent = true



####################################################################################
# Magic Trick and Illusion

# Makes Magic Trick always have enhanced cards and illusion have 20% seals (as it has 20% editions)

## Always pick 'Enhanced' when any playing_card_rate
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''
{type = (G.GAME.used_vouchers["v_illusion"] and pseudorandom(pseudoseed('illusion')) > 0.6) and 'Enhanced' or 'Base', val = G.GAME.playing_card_rate},
'''
position = 'at'
payload = '''
{type = 'Enhanced', val = G.GAME.playing_card_rate},
'''
match_indent = true



## Seal RNG (20% of cards)
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''
if (v.type == 'Base' or v.type == 'Enhanced') and G.GAME.used_vouchers["v_illusion"] and pseudorandom(pseudoseed('illusion')) > 0.8 then 
'''
position = 'before'
payload = '''
if (v.type == 'Base' or v.type == 'Enhanced') and G.GAME.used_vouchers["v_illusion"] and pseudorandom(pseudoseed('illusion')) > 0.8 then 
card:set_seal(SMODS.poll_seal({type_key = 'illusionsl', guaranteed = true}), nil, true)
end
'''
match_indent = true



## Seal prices +$3
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
    end
    self:set_cost()
'''
position = 'at'
payload = '''
    end
    self.base_cost = self.base_cost + 3
    self:set_cost()
'''
match_indent = true



## Apply 20% shopping stickers on playing cards when Magic Trick or Illusion
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
if center_table.name == 'Magic Trick' or center_table.name == 'Illusion' then
'''
position = 'after'
payload = '''
        G.GAME.modifiers.enable_shopping_sticker = true
'''
match_indent = true



####################################################################################
# Square Joker

# Make so Ankh and Invis Joker combine both Square Jokers
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
G.jokers:emplace(card)
'''
position = 'after'
payload = '''
SQUARE_UP()
'''
match_indent = true



####################################################################################
# Lucky Cat

# Increment a global variable when a lucky card procs (so when a Lucky Card hits both, Lucky Cat scales twice)
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
self.lucky_trigger = true
'''
position = 'after'
payload = '''
LUCKY_PROCS = LUCKY_PROCS + 1
'''
match_indent = true