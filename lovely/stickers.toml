[manifest]
version = "1.0.0"
dump_lua = true
priority = 0


####################################################################################
# Beaned

# Makes Beaned sticker give handsize with voucher compatibility
## When acquired
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
self.added_to_deck = true
'''
position = 'after'
payload = '''
if self.ability.beaned then
    G.hand:change_size(1)
end
if self.ability.perishable and G.GAME.modifiers.hybrid_perishable_beaned then
    G.hand:change_size(1)
end
'''
match_indent = true



## When removed
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
self.added_to_deck = false
'''
position = 'after'
payload = '''
if self.ability.beaned then
    G.hand:change_size(-1)
end
if self.ability.perishable and G.GAME.modifiers.hybrid_perishable_beaned then
    G.hand:change_size(-1)
end
'''
match_indent = true



####################################################################################
# Magic Beaned

# Makes Magic Beaned sticker give handsize
## When acquired
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
self.added_to_deck = true
'''
position = 'after'
payload = '''
if self.ability.magic_beaned then
    G.hand:change_size(self.ability.magic_beaned)
end
'''
match_indent = true



## When removed
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
self.added_to_deck = false
'''
position = 'after'
payload = '''
if self.ability.magic_beaned then
    G.hand:change_size(-self.ability.magic_beaned)
end
'''
match_indent = true



# Increase hand size when end of round
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
elseif context.end_of_round then
'''
position = 'after'
payload = '''
if self.ability.magic_beaned and context.main_eval then
    self.ability.magic_beaned = self.ability.magic_beaned + 1
    G.hand:change_size(1)
    card_eval_status_text(self, 'extra', nil, nil, nil, {message = "+1 Hand Size", colour = G.C.FILTER})
end
'''
match_indent = true



####################################################################################
# Paycheck

# Makes paycheck sticker give interest
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
local used_tarot = copier or self
'''
position = 'after'
payload = '''
if self.ability.paycheck and SMODS.pseudorandom_probability(card, "paycheck", 1, 4) then
    generate_interest()
end
'''
match_indent = true



# Makes Wheel of Fortune usable if it has the Paycheck sticker with no jokers to apply edition to
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
if next(self.eligible_strength_jokers) then return true end
'''
position = 'at'
payload = '''
if next(self.eligible_strength_jokers) or self.ability.paycheck then return true end
'''
match_indent = true



# Makes Wheel of Fortune not search for eligible cards when there aren't any (we know it has a paycheck sticker)
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
local temp_pool =   (self.ability.name == 'The Wheel of Fortune' and self.eligible_strength_jokers) or 
'''
position = 'before'
payload = '''
if self.ability.name == 'The Wheel of Fortune' and not next(self.eligible_strength_jokers) then return true end
'''
match_indent = true