[manifest]
version = "1.0.0"
dump_lua = true
priority = 0



####################################################################################
# Stone Seal

# Perma bonus behaviour
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
if self.ability and old_center and old_center.config.bonus then
'''
position = 'before'
payload = '''
if behaveLikeSeal(self,'CTEH_stone') then
    self.ability.perma_bonus = self.ability.perma_bonus + 40
end
'''
match_indent = true


# Discard behaviour
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
if self.seal == 'Purple' and #G.consumeables.cards + G.GAME.consumeable_buffer < G.consumeables.config.card_limit then
'''
position = 'before'
payload = '''
if behaveLikeSeal(self,'CTEH_stone') then
    self:set_ability('m_stone', nil, true)
end
'''
match_indent = true



####################################################################################
# Wild Seals joker

## Blue
